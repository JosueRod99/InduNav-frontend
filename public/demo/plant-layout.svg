<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <!-- Demo plant floor plan. Coordinates match frontend/src/demo/tourLayoutData.ts (SVG space, y down). -->
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E2E8F0" stroke-width="1"/>
    </pattern>
    <pattern id="asphalt" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#CBD5E1"/>
      <circle cx="3" cy="4" r="0.8" fill="#94A3B8"/>
      <circle cx="9" cy="9" r="0.8" fill="#94A3B8"/>
    </pattern>
  </defs>

  <!-- Site -->
  <rect width="1000" height="1000" fill="#F1F5F9"/>
  <rect x="20" y="20" width="960" height="910" fill="url(#grid)" stroke="#64748B" stroke-width="3" stroke-dasharray="14 8"/>

  <!-- Access road -->
  <rect x="0" y="940" width="1000" height="60" fill="url(#asphalt)"/>
  <line x1="0" y1="970" x2="1000" y2="970" stroke="#F8FAFC" stroke-width="3" stroke-dasharray="30 20"/>

  <!-- Maneuvering yard -->
  <rect x="40" y="300" width="180" height="630" fill="url(#asphalt)" stroke="#94A3B8" stroke-width="2"/>
  <g stroke="#F8FAFC" stroke-width="3" stroke-dasharray="18 12">
    <line x1="130" y1="320" x2="130" y2="920"/>
  </g>
  <g fill="#FACC15" opacity="0.9">
    <rect x="200" y="640" width="20" height="40"/>
    <rect x="200" y="740" width="20" height="40"/>
    <rect x="200" y="840" width="20" height="40"/>
  </g>
  <rect x="120" y="925" width="20" height="20" fill="#CBD5E1"/>

  <!-- Offices -->
  <rect x="40" y="60" width="180" height="220" fill="#FFFFFF" stroke="#334155" stroke-width="4"/>
  <line x1="40" y1="170" x2="220" y2="170" stroke="#CBD5E1" stroke-width="2"/>
  <line x1="130" y1="60" x2="130" y2="280" stroke="#CBD5E1" stroke-width="2"/>

  <!-- Building B (Production) -->
  <rect x="240" y="60" width="400" height="500" fill="#FFFFFF" stroke="#334155" stroke-width="5"/>
  <!-- Building A (Receiving) -->
  <rect x="240" y="600" width="200" height="320" fill="#FFFFFF" stroke="#334155" stroke-width="5"/>
  <!-- Building C (Quality) -->
  <rect x="460" y="600" width="180" height="320" fill="#FFFFFF" stroke="#334155" stroke-width="5"/>
  <!-- Building D (Warehouse + Shipping) -->
  <rect x="660" y="60" width="300" height="860" fill="#FFFFFF" stroke="#334155" stroke-width="5"/>
  <line x1="660" y1="700" x2="960" y2="700" stroke="#334155" stroke-width="3"/>

  <!-- Warehouse high-density racks (building D, north) -->
  <g fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5">
    <rect x="690" y="92" width="240" height="20"/>
    <rect x="690" y="138" width="240" height="20"/>
    <rect x="690" y="184" width="240" height="20"/>
    <rect x="690" y="230" width="240" height="20"/>
    <rect x="690" y="276" width="240" height="20"/>
    <rect x="690" y="322" width="240" height="20"/>
    <rect x="690" y="368" width="240" height="20"/>
    <rect x="690" y="414" width="240" height="20"/>
  </g>

  <!-- Receiving bays (west wall of A, facing the yard) -->
  <g fill="#334155">
    <rect x="234" y="640" width="12" height="40"/>
    <rect x="234" y="740" width="12" height="40"/>
    <rect x="234" y="840" width="12" height="40"/>
  </g>

  <!-- Shipping docks (south wall of D, facing the road) -->
  <g fill="#334155">
    <rect x="672" y="914" width="24" height="12"/>
    <rect x="707" y="914" width="24" height="12"/>
    <rect x="742" y="914" width="24" height="12"/>
    <rect x="777" y="914" width="24" height="12"/>
    <rect x="812" y="914" width="24" height="12"/>
    <rect x="847" y="914" width="24" height="12"/>
    <rect x="882" y="914" width="24" height="12"/>
    <rect x="917" y="914" width="24" height="12"/>
  </g>

  <!-- Passages between buildings -->
  <g fill="#E2E8F0">
    <rect x="440" y="740" width="20" height="40"/>
    <rect x="640" y="740" width="20" height="40"/>
    <rect x="480" y="560" width="40" height="40"/>
  </g>

  <!-- Building letters (match the "Edificio A/B/C/D" texts of the tour) -->
  <g font-family="Helvetica, Arial, sans-serif" font-weight="700" fill="#CBD5E1" text-anchor="middle">
    <text x="300" y="130" font-size="48">B</text>
    <text x="415" y="895" font-size="40">A</text>
    <text x="615" y="895" font-size="40">C</text>
    <text x="935" y="105" font-size="40">D</text>
  </g>

  <!-- North arrow -->
  <g transform="translate(85 345)">
    <circle r="22" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
    <path d="M 0 -15 L 7 8 L 0 3 L -7 8 Z" fill="#334155"/>
    <text y="-26" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">N</text>
  </g>
</svg>
